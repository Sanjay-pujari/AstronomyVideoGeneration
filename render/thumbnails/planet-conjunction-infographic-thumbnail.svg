      <circle cx="2960" cy="105" r="48" fill="#f4c56a"/><circle cx="2942" cy="101" r="9" fill="#071a36"/><circle cx="2978" cy="101" r="9" fill="#071a36"/><path d="M2935 128 c20 14 48 14 70 0" stroke="#071a36" stroke-width="10" fill="none" stroke-linecap="round"/>
