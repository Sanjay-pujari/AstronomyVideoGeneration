<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Jupiter + Venus Planet Conjunction Thumbnail</title>
  <desc id="desc">Premium dark blue and gold astronomy infographic thumbnail with a twilight horizon, dominant realistic Jupiter and Venus on the right, glassmorphism observation card on the left, west marker, and compact footer tips.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06142f"/>
      <stop offset="0.46" stop-color="#0b234a"/>
      <stop offset="0.72" stop-color="#5d3b2b"/>
      <stop offset="1" stop-color="#e7a84c"/>
    </linearGradient>
    <radialGradient id="sunset" cx="58%" cy="84%" r="58%">
      <stop offset="0" stop-color="#ffd17a" stop-opacity="0.78"/>
      <stop offset="0.35" stop-color="#d98a3f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#091936" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jupiter" cx="38%" cy="34%" r="62%">
      <stop offset="0" stop-color="#fff5d6"/>
      <stop offset="0.3" stop-color="#d9b36f"/>
      <stop offset="0.6" stop-color="#9a673e"/>
      <stop offset="1" stop-color="#4d2d24"/>
    </radialGradient>
    <radialGradient id="venus" cx="35%" cy="30%" r="68%">
