      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <clipPath id="cardClip"><rect x="190" y="565" width="900" height="710" rx="58"/></clipPath>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#sunset)"/>
  <g opacity="0.32" fill="#ffffff">
