      <text x="705" y="124" font-size="54">LOOK WEST</text>
      <circle cx="1745" cy="105" r="48" fill="#f4c56a"/><path d="M1712 113 c34 -54 72 -54 100 0" stroke="#071a36" stroke-width="12" fill="none" stroke-linecap="round"/>
